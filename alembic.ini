# Alembic configuration for feature-store-mvp.
# Run migrations from the project root: `alembic upgrade head`
# The actual DB URL is injected by alembic/env.py from src.config.settings.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder URL — overridden in env.py via settings.postgres_url.
sqlalchemy.url = postgresql+psycopg2://feature_store:changeme@localhost/feature_store

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
